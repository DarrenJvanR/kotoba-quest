<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kotoba Quest</title>
  <meta name="description" content="Learn hiragana and katakana a little every day.">
  <meta name="theme-color" content="#141226">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Klee+One:wght@600&family=Noto+Sans+JP:wght@500;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="shell">
    <header class="top">
      <div class="brand"><span class="kana-brand">ことば</span> Quest</div>
      <div id="hud" class="hud"></div>
    </header>
    <main id="view"></main>
  </div>
  <nav class="tabs" aria-label="Main">
    <button data-tab="home" class="on"><span>🏮</span>Home</button>
    <button data-tab="town"><span>🏯</span>Town</button>
    <button data-tab="library"><span class="kana">あ</span>Library</button>
    <button data-tab="settings"><span>⚙</span>Settings</button>
  </nav>
  <div id="modal" class="modal" hidden></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
